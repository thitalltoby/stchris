# FREE DEMO setup for Render (https://render.com/docs/blueprint-spec). Create it with New → Blueprint.
# Free instances have no disk, shell or pre-deploy step, so each start runs the migrations and, while
# SEED_ADMIN_EMAIL is set, the seed (it only adds missing content and sets the admin password).
# Limits: the site sleeps after ~15 idle minutes (first visit then takes about a minute), uploaded files
# are lost on every redeploy, email is off and background jobs do not run. For the real site use
# deploy/render.paid.yaml.
# The database is external (e.g. a free Supabase or Neon project), because a Render workspace can only have one
# free database. For Supabase use the Session pooler string (port 5432): the direct one is IPv6-only and Render
# has no outbound IPv6, and the Transaction pooler (port 6543) cannot run migrations. For Neon use the direct string.

services:
  - type: web
    name: stchris
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerCommand: npm run start:demo
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: APP_URL
        value: https://stchris.onrender.com # change if Render gives the service a different address
      - key: STORAGE_DIR
        value: /data/storage
      - key: TRUST_PROXY
        value: "true"
      # No email provider in the demo, so visitors can register without confirming their address
      - key: AUTH_REQUIRE_EMAIL_VERIFICATION
        value: "false"
      # The first Super Admin; Render asks for both when the Blueprint is created
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
